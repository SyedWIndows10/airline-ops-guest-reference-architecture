<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>IROPS Pipeline — Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>IROPS Pipeline — Live Fan-Out</h1>
    <span id="status" class="status disconnected">connecting…</span>

  <main>

      <svg id="edges"></svg>
      <div id="nodes"></div>

    <aside id="feed">

      <div id="feed-list"></div>
    </aside>
  </main>

  <script src="app.js"></script>
</body>
</html>
